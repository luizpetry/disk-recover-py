[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-recover-py"
version = "2.0.0"
description = "File Carving Recovery Tool — recupera arquivos de discos/pendrives formatados"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Luiz Petry", email = "juniorpetry.k1@gmail.com"},
]
dependencies = [
    "tqdm>=4.66.3",
]
keywords = ["file-carving", "recovery", "forensics", "data-recovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Security",
]

[tool.setuptools.packages.find]
include = ["file_carver*"]

[project.scripts]
disk-recover = "file_carver.cli:run_interactive"

[project.urls]
Homepage = "https://github.com/luizpetry/disk-recover-py"
Repository = "https://github.com/luizpetry/disk-recover-py"
